<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoRadar Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="flex justify-between items-center border-b border-slate-800 pb-6 mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">CryptoRadar v1.0</h1>
                <p class="text-slate-400 text-sm mt-1">Мониторинг лучшего курса и арбитраж в реальном времени</p>
            </div>
            <div class="flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-full border border-slate-700">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Live API</span>
            </div>
        </header>

        <div id="cards-container" class="grid gap-6 md:grid-cols-3">
            <div class="col-span-3 text-center py-12 text-slate-500">
                Ожидание данных от Go-бэкенда...
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
